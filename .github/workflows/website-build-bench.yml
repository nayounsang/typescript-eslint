name: Website Build Bench
on:
  push:
    branches: ['bench/**']
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-install
        with:
          node-version: 24
      - name: Build packages (untimed)
        run: pnpm exec nx run-many --target=build --parallel --exclude=website --exclude=website-eslint --skip-nx-cache
      - name: Build website-eslint (untimed)
        run: pnpm exec nx build website-eslint --skip-nx-cache
      - name: Timed docusaurus build
        working-directory: packages/website
        run: |
          start=$(date +%s)
          pnpm exec docusaurus build
          end=$(date +%s)
          echo "BENCH_SECONDS=$((end-start))"
          echo "### docusaurus build: $((end-start))s" >> "$GITHUB_STEP_SUMMARY"
